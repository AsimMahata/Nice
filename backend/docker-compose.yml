services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules

      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PORT=3000
      - NODE_ENV=development
      
      # If set and on Linux, Isolyx will be tried before Docker for sandboxing
      # - ISOLYX_BIN=/usr/local/bin/isolyx
